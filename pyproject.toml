[project]
name = "recommender"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "bohyun-shin", email = "shinbo0613@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.6.0",
    "torch==2.5.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "tqdm>=4.65.0,<4.66.0",
    "implicit>=0.7.2,<0.8.0",
    "requests>=2.32.3",
    "matplotlib==3.9.2",
    "seaborn>=0.13.2",
    "gdown==5.2.0",
    "pymongo==4.11.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.9",
    "pre-commit>=4.0,<4.1",
]

[tool.pytest.ini_options]
markers = [
    "requires_data: marks tests that require real dataset files (skipped by default)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
